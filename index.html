<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Event sign-up tracker</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<h1>Event sign-up tracker</h1>
  <div class="bar">
    <input id="search" autocomplete="off" placeholder="Search name, old name or ID">
    <label><input type="checkbox" id="showFormer"> Show former players</label>
    <button id="showPlayer">Add player</button>
    <button id="showPaste">Paste players</button>
    <button id="showEvent">Add event</button>
    <button id="exportBtn">Export backup</button>
    <button id="exportGhBtn">Export for GitHub (data.json)</button>
    <label class="btn">Import backup<input type="file" id="importFile" accept=".json" hidden></label>
  </div>
  <form id="playerForm" class="panel" autocomplete="off" hidden>
    <input id="pName" placeholder="Player name" required>
    <input id="pId" placeholder="Player ID" required>
    <select id="pRank"><option value="">Rank: other</option><option>R4</option><option>R5</option></select>
    <button type="submit">Save player</button>
  </form>
  <form id="pasteForm" class="panel" autocomplete="off" hidden>
    <textarea id="pasteBox" rows="8" cols="60" placeholder="Paste the rows copied from your doc: rank, name, ID (one player per line)"></textarea>
    <button type="submit">Import players</button>
  </form>
  <form id="eventForm" class="panel" autocomplete="off" hidden>
    <select id="eType"><option>Swordland Showdown</option><option>Tri-Alliance</option></select>
    <input id="eDate" type="date" required>
    <label>Legion 1 time <input id="eT1" type="time" required></label>
    <label>Legion 2 time <input id="eT2" type="time" required></label>
    <button type="submit">Save event</button>
  </form>
<div class="wrap" id="wrap"><table id="grid"></table></div>
<div id="modalOverlay" class="modal-overlay" hidden><div class="modal-box" id="modalBox"></div></div>
<script src="script.js"></script>
</body>
</html>
