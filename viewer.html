<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Event sign-up tracker (view only)</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<h1>Event sign-up tracker <span style="font-size:12px;font-weight:normal;color:#888">(view only)</span></h1>
<div class="bar">
  <input id="search" autocomplete="off" placeholder="Search name, old name or ID">
  <label><input type="checkbox" id="showFormer"> Show former players</label>
  <button id="refreshBtn">Refresh data</button>
  <span id="status" style="font-size:12px;color:#777"></span>
</div>
<div class="wrap" id="wrap"><table id="grid"></table></div>
<div id="modalOverlay" class="modal-overlay" hidden><div class="modal-box" id="modalBox"></div></div>
<script src="viewer.js"></script>
</body>
</html>
